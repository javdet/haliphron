  haliphron-runtime:
  - apiVersion: v2
    appVersion: 0.5.4
    created: "2026-10-29T09:15:55.493328968Z"
    description: 'The Haliphron controller and everything an agent run needs inside
      a target cluster: the AgentRun CRD, the agents'' namespace with its quota and
      its default-deny network policy, and the RBAC for both. Installed once per cluster.
      It holds no database, no UI and no engine — only a controller that fetches work
      from the control plane and reports back. '
