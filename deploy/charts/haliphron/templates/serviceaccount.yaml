{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "haliphron.serviceAccountName" . }}
  labels: {{- include "haliphron.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The backend reaches Postgres and S3 and never the API server, so it has no
# RBAC at all and no reason to carry a token that would let it try.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
