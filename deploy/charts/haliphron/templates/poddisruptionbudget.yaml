{{/*
Skipped at one replica, where a budget of minAvailable: 1 makes the node
undrainable rather than the service highly available. With autoscaling on it is
minReplicas that decides, since replicaCount is then unused.
*/}}
{{- $replicas := int .Values.backend.replicaCount -}}
{{- if .Values.autoscaling.enabled -}}{{- $replicas = int .Values.autoscaling.minReplicas -}}{{- end -}}
{{- if and .Values.podDisruptionBudget.enabled (gt $replicas 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "haliphron.fullname" . }}
  labels: {{- include "haliphron.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels: {{- include "haliphron.selectorLabels" . | nindent 6 }}
{{- end }}
