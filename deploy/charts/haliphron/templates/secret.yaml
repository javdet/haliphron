{{/*
Only what was given as a literal. A credential supplied through an existing
Secret is referenced where it lives and is never copied here, which keeps
`helm get values` from being a way to read it.
*/}}
{{- $dsn := .Values.database.dsn -}}
{{- if and (not $dsn) (not .Values.database.existingSecret) .Values.postgresql.enabled -}}
{{- $dsn = include "haliphron.derivedDSN" . -}}
{{- end -}}
{{- $access := .Values.objectStorage.accessKey -}}
{{- $secret := .Values.objectStorage.secretKey -}}
{{- if and (not $access) (not .Values.objectStorage.existingSecret) .Values.minio.enabled -}}
{{- $access = .Values.minio.auth.rootUser -}}
{{- $secret = .Values.minio.auth.rootPassword -}}
{{- end -}}
{{/*
The key encryption key is not here. It is in a Secret of its own, because it
outlives everything in this one: see templates/secret-kek.yaml.
*/}}
{{- if or $dsn $access .Values.objectStorage.sessionToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haliphron.secretName" . }}
  labels: {{- include "haliphron.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and $dsn (not .Values.database.existingSecret) }}
  dsn: {{ $dsn | quote }}
  {{- end }}
  {{- if and $access (not .Values.objectStorage.existingSecret) }}
  accessKey: {{ $access | quote }}
  secretKey: {{ $secret | quote }}
  {{- end }}
  {{- with .Values.objectStorage.sessionToken }}
  sessionToken: {{ . | quote }}
  {{- end }}
{{- end }}
