{{- if include "haliphron.frontend.enabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "haliphron.frontend.fullname" . }}
  labels: {{- include "haliphron.frontend.labels" . | nindent 4 }}
  {{- with .Values.frontend.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector: {{- include "haliphron.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
