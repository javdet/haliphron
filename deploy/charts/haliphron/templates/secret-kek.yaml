{{- if (include "haliphron.kekOwned" .) }}
{{/*
The key that wraps every managed secret.

It never enters the database — that is the whole property, and it is what
makes a database dump not a credential leak. It is also what makes this Secret
the one object in the installation that cannot be recreated: lose it and every
managed secret is ciphertext nobody can open, including the model keys runs
are launched with.

Hence two things that the credentials Secret does not have:

  * resource-policy: keep. `helm uninstall` takes the Deployment, the Service
    and the DSN with it, and leaves this behind. A reinstall under the same
    release name adopts it and the data is readable again. Deleting it is a
    `kubectl delete secret` an operator types on purpose, next to the backup.

  * A value that survives upgrades untouched. The template reads back what it
    wrote rather than generating afresh, so `helm upgrade` re-renders the same
    bytes. See haliphron.kekValue for what that costs under GitOps.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haliphron.kekSecretName" . }}
  labels: {{- include "haliphron.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    haliphron.io/purpose: >-
      The key encryption key for managed secrets. It is not in the database and
      cannot be derived from it. Back it up; losing it loses every managed
      secret.
type: Opaque
stringData:
  kek: {{ include "haliphron.kekValue" . | quote }}
{{- end }}
