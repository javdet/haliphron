{{- if (include "haliphron.bootstrapOwned" .) }}
{{/*
The first admin token, and the only credential this chart invents rather than
being given.

It has to be invented somewhere: every endpoint of the public API needs a
bearer token, and the endpoint that issues tokens is itself admin-scoped, so a
fresh installation has no way in. The backend writes this value to its token
store at startup, with the admin scope and the name "bootstrap", and an
operator reads it out of here once, signs in, mints a token of their own and
revokes this one.

A Secret of its own rather than a key in the credentials Secret, because the
two have different lifetimes: the DSN is there for as long as the installation
is, and this is meant to be spent. Deleting it after the credential has been
revoked leaves a working release behind — the value is only ever read at
startup, and on the next start the backend finds the row revoked and says so
rather than reinstating it.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haliphron.bootstrapSecretName" . }}
  labels: {{- include "haliphron.labels" . | nindent 4 }}
  annotations:
    haliphron.io/purpose: >-
      The admin token this installation started with. Sign in, mint a token of
      your own, revoke this one.
type: Opaque
stringData:
  token: {{ include "haliphron.bootstrapToken" . | quote }}
{{- end }}
