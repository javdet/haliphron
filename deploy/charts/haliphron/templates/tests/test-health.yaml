{{/*
`helm test` asks the one question an install cannot answer by itself: does a
pod in this namespace get "ready" out of the readiness endpoint — which means
the Service resolves, a replica is up, and the database answers it.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "haliphron.fullname" . }}-test-health
  labels: {{- include "haliphron.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      args:
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "10"
        - http://{{ include "haliphron.fullname" . }}:{{ .Values.service.ports.health }}/readyz
