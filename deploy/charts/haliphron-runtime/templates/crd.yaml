                        description: |-
                          Key is relative to nothing: it is the full key under the layout in
                          section 9.2, runs/{runID}/result.md and so on.
                        maxLength: 1024
                        minLength: 1
                        type: string
                      sha256:
                        maxLength: 64
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      sizeBytes:
                        format: int64
                        minimum: 0
                        type: integer
                      uploaded:
                        description: |-
                          Uploaded is what the backend checks before believing a ref. In relay
                          mode it is the controller's acknowledgement that the bytes reached a
                          disk that is not the pod's; in object-store mode it is the pod's own
                          PUT. A ref without it names a key nothing was ever written to.
                        type: boolean
                    required:
                    - key
                    type: object
                  relayed:
                    description: |-
                      Relayed means these objects went through this controller's spool rather
                      than straight from the pod to an object store. It is the difference
                      between "the backend has them" and "the backend can fetch them", which is
                      what an operator reading a stuck run needs to know first.
                    type: boolean
                  result:
                    description: |-
                      ObjectRef points at an object in the artifact store. Content never travels
                      through these contracts; only the pointer does.

                      There is deliberately no bucket. Which store holds the object is the
                      installation's business — a PVC on the backend in relay mode, S3 in
                      object-store mode — and the pod is told neither. A pod that never learns a
                      bucket name cannot leak one, and a key that means the same thing in both
                      modes is what lets the mode stay invisible above the ArtifactStore port.
                    properties:
                      contentType:
                        maxLength: 128
                        type: string
                      key:
                        description: |-
                          Key is relative to nothing: it is the full key under the layout in
                          section 9.2, runs/{runID}/result.md and so on.
                        maxLength: 1024
                        minLength: 1
                        type: string
                      sha256:
                        maxLength: 64
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      sizeBytes:
                        format: int64
                        minimum: 0
                        type: integer
                      uploaded:
                        description: |-
                          Uploaded is what the backend checks before believing a ref. In relay
                          mode it is the controller's acknowledgement that the bytes reached a
                          disk that is not the pod's; in object-store mode it is the pod's own
                          PUT. A ref without it names a key nothing was ever written to.
                        type: boolean
                    required:
                    - key
                    type: object
                type: object
              retry:
                description: |-
                  Retry records the controller's local retry budget. It is here rather than
                  in memory so that a controller restart does not hand a failing run a
                  fresh set of attempts.
                properties:
                  infraRetries:
                    format: int32
                    minimum: 0
                    type: integer
                  nextAttemptAt:
                    description: |-
                      NextAttemptAt is when the next Job may be created. Backoff is exponential
                      with jitter; an ImagePullBackOff on a bad node otherwise turns into a
                      tight create/fail loop against the API server.
                    format: date-time
                    type: string
                type: object
              startedAt:
                format: date-time
                type: string
              usage:
                description: |-
                  Usage is what the pod declared it spent. Self-reported and therefore not
                  authoritative; it is here for `kubectl` and for the backend's
                  cross-check against the observed Job duration.
                properties:
                  cacheReadTokens:
                    format: int64
                    type: integer
                  cacheWriteTokens:
                    format: int64
                    type: integer
                  durationMs:
                    format: int64
                    type: integer
                  inputTokens:
                    format: int64
                    type: integer
                  numTurns:
                    format: int32
                    type: integer
                  outputTokens:
                    format: int64
                    type: integer
                  sessionID:
                    maxLength: 256
                    type: string
                  totalCostUSD:
                    description: |-
                      MoneyUSD is a decimal string. Money is never a float64 here, and never a
                      Kubernetes Quantity either: Quantity would round 0.4231 into a form nobody
                      expects to see in a bill.
                    maxLength: 32
                    pattern: ^-?[0-9]{1,12}(\.[0-9]{1,6})?$
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
  {{- if .Values.crd.conversionWebhook.enabled }}
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1"]
      clientConfig:
        service:
          namespace: {{ .Release.Namespace }}
          name: {{ include "haliphron-runtime.fullname" . }}-webhook
          path: /convert
          port: 443
  {{- end }}
{{- end }}
