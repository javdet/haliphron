{{- if and .Values.backend.bootstrapToken (not .Values.backend.bootstrapTokenExistingSecret) }}
{{/*
The token registers this cluster once and is then useless: the controller
exchanges it for a key pair it keeps in identity.secretName. It is still the
one credential that can register a cluster, which is why the chart mounts it as
a file rather than passing it as a variable, and why an existing Secret is the
better of the two ways to supply it.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haliphron-runtime.bootstrapSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "haliphron-runtime.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.backend.bootstrapToken | quote }}
{{- end }}
