{{- include "haliphron-runtime.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "haliphron-runtime.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "haliphron-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  strategy:
    # Recreate, not RollingUpdate. Leader election makes two replicas safe, but
    # a rollout that overlaps them spends the lease duration with neither
    # reconciling, and a controller that is briefly absent is cheaper than one
    # that is briefly ambiguous.
    type: Recreate
  selector:
    matchLabels: {{- include "haliphron-runtime.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "haliphron-runtime.selectorLabels" . | nindent 8 }}
        {{- with .Values.controller.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/bootstrap: {{ include (print $.Template.BasePath "/secret-bootstrap.yaml") . | sha256sum }}
        {{- with .Values.controller.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "haliphron-runtime.serviceAccountName" . }}
      # True here, and only here. The controller is the one component that
      # talks to the API server; the agent pods it creates carry no token.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext: {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.controller.terminationGracePeriodSeconds }}
      containers:
        - name: controller
          image: {{ include "haliphron-runtime.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.controller.securityContext | nindent 12 }}
          env:
            - name: HALIPHRON_BACKEND_URL
              value: {{ .Values.backend.url | quote }}
            # A file, not a value: a one-time token in a variable is visible in
            # `kubectl describe pod`.
            - name: HALIPHRON_BOOTSTRAP_TOKEN_FILE
              value: /haliphron/bootstrap/{{ include "haliphron-runtime.bootstrapSecretKey" . }}
            - name: HALIPHRON_CLUSTER_NAME
              value: {{ .Values.cluster.name | quote }}
            {{- if .Values.cluster.labels }}
            {{- $pairs := list }}
            {{- range $k, $v := .Values.cluster.labels }}{{ $pairs = append $pairs (printf "%s=%s" $k $v) }}{{ end }}
            - name: HALIPHRON_CLUSTER_LABELS
              value: {{ join "," $pairs | quote }}
            {{- end }}
            - name: HALIPHRON_CAPACITY_SLOTS
              value: {{ .Values.cluster.capacitySlots | quote }}
            - name: HALIPHRON_RUNTIMES
              value: {{ join "," .Values.cluster.runtimes | quote }}
            # The downward API rather than the release namespace, so that a
            # pod moved by hand still knows where it is.
            - name: HALIPHRON_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HALIPHRON_AGENT_NAMESPACE
              value: {{ include "haliphron-runtime.agentNamespace" . | quote }}
            - name: HALIPHRON_AGENT_SERVICE_ACCOUNT
              value: {{ include "haliphron-runtime.agentServiceAccountName" . | quote }}
            - name: HALIPHRON_IDENTITY_SECRET
              value: {{ .Values.identity.secretName | quote }}
            - name: HALIPHRON_CALLBACK_URL
              value: {{ include "haliphron-runtime.callbackURL" . | quote }}
            - name: HALIPHRON_CALLBACK_ADDR
              value: ":{{ .Values.controller.callbackPort }}"
            - name: HALIPHRON_HEALTH_ADDR
              value: ":{{ .Values.controller.healthPort }}"
            - name: HALIPHRON_METRICS_ADDR
              value: ":{{ .Values.controller.metricsPort }}"
            {{- with .Values.controller.runURLTemplate }}
            - name: HALIPHRON_RUN_URL_TEMPLATE
              value: {{ . | quote }}
            {{- end }}
            - name: HALIPHRON_GRACE_SECONDS
              value: {{ .Values.controller.graceSeconds | quote }}
            - name: HALIPHRON_DEADLINE_SLACK_SECONDS
              value: {{ .Values.controller.deadlineSlackSeconds | quote }}
            - name: HALIPHRON_STARTUP_DEADLINE_SECONDS
              value: {{ .Values.controller.startupDeadlineSeconds | quote }}
            - name: HALIPHRON_PREFLIGHT_JOB
              value: {{ .Values.controller.preflightJob | quote }}
            - name: HALIPHRON_LOG_LEVEL
              value: {{ .Values.controller.logLevel | quote }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.controller.extraEnvFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: callback
              containerPort: {{ .Values.controller.callbackPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.controller.healthPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.controller.metricsPort }}
              protocol: TCP
          # Registration happens before the manager starts and retries with
          # backoff against a control plane that may not be up yet, so the
          # startup probe is generous where the liveness probe is not.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - name: bootstrap
              mountPath: /haliphron/bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          secret:
            secretName: {{ include "haliphron-runtime.bootstrapSecretName" . }}
            defaultMode: 0400
            items:
              - key: {{ include "haliphron-runtime.bootstrapSecretKey" . }}
                path: {{ include "haliphron-runtime.bootstrapSecretKey" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
