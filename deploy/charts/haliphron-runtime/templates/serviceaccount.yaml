{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "haliphron-runtime.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "haliphron-runtime.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.agents.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "haliphron-runtime.agentServiceAccountName" . }}
  namespace: {{ include "haliphron-runtime.agentNamespace" . }}
  labels:
    {{- include "haliphron-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents
  {{- with .Values.agents.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The agent pods' identity, and not one RBAC rule is bound to it. It exists so
# that the pods have a name in audit logs, not so that they can do anything.
# The pod spec sets automountServiceAccountToken: false besides.
automountServiceAccountToken: false
{{- end }}
