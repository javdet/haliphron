{{- $ns := include "haliphron-runtime.agentNamespace" . -}}
{{- if .Values.agents.networkPolicy.enabled }}
{{/*
The agent pod runs commands a model wrote, against a repository whose contents
may contain prompt injection. This is the policy that treats it that way.

Ingress is denied entirely — nothing in the cluster has a reason to call into
an agent pod. Egress is allowed to DNS, to the controller's callback, and to
the CIDRs named in values, which in practice means the internet minus the
cluster's own private ranges. In particular it does not include
kubernetes.default: a pod that reaches the API server has already gone wrong,
and it carries no token to use there anyway.

In the default relay artifact mode that list is the whole of it, and the
omission is worth naming: there is no egress rule for storage, because the pod
never talks to any. Its results go to the controller on the same port its
completion does. Object-store mode is what adds an S3 endpoint to
allowedCIDRs — one more reachable network for the least trusted component in
the system, and one of the quieter reasons the default is what it is.

There is no filtering by hostname, and there cannot be: NetworkPolicy matches
addresses, and FQDN policies are not available on every CNI. An agent that
reaches a permitted CIDR can reach any host inside it. That is a known,
accepted limitation rather than an oversight.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-agents" (include "haliphron-runtime.fullname" .) }}
  namespace: {{ $ns }}
  labels:
    {{- include "haliphron-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents
spec:
  # Every pod in the namespace, not only the ones this release knows about.
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The controller: the completion report, the phase transitions, and — in
    # relay mode — every artifact the run produces. One port for all three.
    #
    # Without this rule in relay mode the run cannot persist anything at all.
    # Without it in object-store mode the result is still durable and the
    # controller learns of the run's end only from the Job, which is the
    # CompletedWithoutResult path.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels: {{- include "haliphron-runtime.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.controller.callbackPort }}
          protocol: TCP
    {{- with .Values.agents.networkPolicy.allowedCIDRs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
            {{- with $.Values.agents.networkPolicy.exceptCIDRs }}
            except: {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
      ports: {{- toYaml $.Values.agents.networkPolicy.ports | nindent 8 }}
    {{- end }}
{{- end }}
