# The control plane on the ai-infra node group.
#
# Site-specific, and therefore here rather than in the chart's defaults: a node
# group name is true of one fleet and of no other installation.
#
#   helm install haliphron deploy/charts/haliphron -n haliphron \
#     -f deploy/values/ai-infra-control-plane.yaml

# The node group is tainted as well as labelled, so a selector alone places
# nothing: the scheduler needs the matching toleration to be allowed to put a
# pod there at all.
nodeSelector:
  nodegroup: ai-infra
tolerations:
  - key: nodegroup
    operator: Equal
    value: ai-infra
    effect: NoSchedule

# The agent pods, which the control plane places because placement travels in
# the lease. A role that names its own nodeSelector replaces this.
agent:
  nodeSelector:
    nodegroup: ai-infra
  tolerations:
    - key: nodegroup
      operator: Equal
      value: ai-infra
      effect: NoSchedule

# The UI, and the one route that serves it.
#
# The route points at the frontend Service rather than at the backend: the UI's
# nginx serves the page and proxies /api to the backend behind it, so the page
# and the API it calls are one origin. The backend sends no CORS headers — its
# callers are controllers and scripts, not browsers — so a UI on a second
# hostname could not call it at all.
frontend:
  enabled: true
  nodeSelector:
    nodegroup: ai-infra
  tolerations:
    - key: nodegroup
      operator: Equal
      value: ai-infra
      effect: NoSchedule

httpRoute:
  api:
    enabled: true
    hostnames:
      - agent-gw.theinfranod.com
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: infra-gateway
        namespace: gateway-api
        sectionName: infra

  # MCP is a second listener on a second port, and the UI's nginx does not
  # proxy it — only /api. Exposing it is a separate decision from exposing the
  # UI, so it is written out here and left off: an MCP endpoint on the public
  # internet accepts a bearer token from anyone who has one.
  #
  # mcp:
  #   enabled: true
  #   hostnames:
  #     - agent-gw.theinfranod.com
  #   matches:
  #     - path:
  #         type: PathPrefix
  #         value: /mcp
  #   parentRefs:
  #     - group: gateway.networking.k8s.io
  #       kind: Gateway
  #       name: infra-gateway
  #       namespace: gateway-api
  #       sectionName: infra

# One node in the group, so there is nothing to spread across. Left at the
# chart's default the constraint is satisfied trivially; it is stated here so
# that adding a second node does not change behaviour silently.
topologySpreadConstraints: []

# The evaluation database, if it is turned on (--set postgresql.enabled=true).
# A subchart places its own pods, so the node group has to be repeated here;
# leaving it out is a Postgres that lands on whatever node has room, which is
# fine until the day the artifact volume and the database are on different
# ones.
postgresql:
  enabled: true
  auth:
    username: haliphron
    password: "haliphron87234!"
    database: haliphron
  primary:
    nodeSelector:
      nodegroup: ai-infra
    tolerations:
      - key: nodegroup
        operator: Equal
        value: ai-infra
        effect: NoSchedule
    persistence:
      enabled: true
      size: 20Gi
