name: Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The Docker Hub namespace. The charts' own defaults still say automagicops/…;
# override image.repository at install time, or change the values files, if the
# charts are meant to pull from these.
#
# The charts are published on v* tags only, two ways: as OCI artifacts under
# CHART_REPO, and as a classic Helm repository on GitHub Pages at PAGES_URL.
env:
  IMAGE_PREFIX: javdet
  CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

# A second push to main supersedes the first. Tag builds are never cancelled:
# a release that half-published is worse than one that waits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify generated artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify
        run: make verify

  fake-test:
    name: Test fakes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test
        run: make fake-test

  # The agent image entrypoint, plus the cross-module suite that drives it
  # against fake/controlplane in process. No cluster, no database.
  image-test:
    name: Test agent entrypoint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test
        run: make image-test

  # There is no separate lint for the UI: tsc with noUnused* on is the lint.
  frontend-check:
    name: Check frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Typecheck
        run: make frontend-check

  # chart-lint also runs chart-gen and chart-deps, so it catches a stale CRD
  # copy and an unresolvable dependency as well. chart-template renders both
  # charts, which catches what lint does not.
  chart-lint:
    name: Lint charts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pinned to the version that generated Chart.lock: helm refuses a build
      # when the lock's digest does not match what it would compute itself.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.0

      - name: Lint
        run: make chart-lint

      - name: Template
        run: make chart-template


  push-images:
    name: Push ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: [verify, fake-test, image-test, frontend-check, chart-lint]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # `image` is the repository under IMAGE_PREFIX; the matrix is
          # evaluated before the env context exists, so it cannot be spliced
          # in here and is prepended at the tags below instead.
          - name: backend
            image: haliphron-backend
            context: .
            file: backend/Dockerfile
            platforms: linux/amd64,linux/arm64
            versioned: true
          - name: controller
            image: haliphron-controller
            context: .
            file: controller/Dockerfile
            platforms: linux/amd64,linux/arm64
            versioned: true
          - name: frontend
            image: haliphron-frontend
            context: frontend
            file: frontend/Dockerfile
            platforms: linux/amd64
            versioned: false
          - name: agent
            image: haliphron-agent
            context: .
            file: image/Dockerfile
            platforms: linux/amd64
            versioned: true
            # min, not max: the agent image's expensive layers (apt, nodesource,
            # gh/glab, the two agent CLIs) are all in the final stage, so they
            # are cached either way, and a ~2 GB image exported with mode=max
            # evicts the other three scopes out of the 10 GB cache.
            cache_mode: min
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # VERSION is the source for the image tag. A tag push overrides it with
      # the tag itself, so v0.2.0 publishes :0.2.0 whatever the file says.
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          # The frontend Dockerfile declares no VERSION arg, and BuildKit warns
          # about one it was not asked for.
          build-args: ${{ matrix.versioned && format('VERSION={0}', steps.version.outputs.value) || '' }}
          # :latest only from main. A tag push on an older commit would
          # otherwise move it backwards. Empty lines are dropped by the action.
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:latest', env.IMAGE_PREFIX, matrix.image) || '' }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          # Off because a provenance attestation shows up on Docker Hub as an
          # extra unknown/unknown platform on every tag.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=${{ matrix.cache_mode || 'max' }}

  # A release is a v* tag. The charts go out only after every image the tag
  # names has been pushed: a published chart whose appVersion does not resolve
  # is an install that fails at ImagePullBackOff.
  #
  # A version, once published, is never replaced. A re-run of the same tag
  # skips what is already in GHCR and on gh-pages, because a chart re-packaged
  # under the same version has a different digest, and the digest is what a
  # consumer's Chart.lock and the repository index pin.
  publish-charts:
    name: Publish charts
    runs-on: ubuntu-24.04
    needs: [push-images]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # gh-pages, and the GitHub release
      packages: write   # the OCI charts on GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.0

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: make chart-package CHART_VERSION=${{ steps.version.outputs.value }}

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push to GHCR (OCI)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for chart in haliphron haliphron-runtime; do
            if helm show chart "oci://${CHART_REPO}/${chart}" --version "$VERSION" >/dev/null 2>&1; then
              echo "${chart} ${VERSION} is already in ${CHART_REPO}, kept"
            else
              helm push "dist/${chart}-${VERSION}.tgz" "oci://${CHART_REPO}"
            fi
          done

      # The branch is created on the first release. GitHub Pages still has to
      # be pointed at it once, by hand, in the repository settings.
      - name: Check out gh-pages
        run: |
          rc=0
          git ls-remote --exit-code --heads origin gh-pages >/dev/null || rc=$?
          case "$rc" in
            0) git fetch --depth=1 origin gh-pages
               git worktree add -B gh-pages gh-pages FETCH_HEAD ;;
            2) git worktree add --orphan -b gh-pages gh-pages
               touch gh-pages/.nojekyll ;;
            *) exit "$rc" ;;
          esac

      # Only the new packages are indexed, then merged into the published
      # index, so the entries already there keep their digests and timestamps.
      # `helm repo index` over the whole branch would regenerate every one.
      - name: Publish to the Helm repository (GitHub Pages)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p staging
          for f in dist/*.tgz; do
            if [ -e "gh-pages/$(basename "$f")" ]; then
              echo "$(basename "$f") is already on gh-pages, kept"
            else
              cp "$f" staging/
            fi
          done
          if [ -z "$(ls staging)" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          helm repo index staging --url "$PAGES_URL" --merge gh-pages/index.yaml
          mv staging/* gh-pages/
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish haliphron charts ${VERSION}"
          git push origin gh-pages

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.tgz
