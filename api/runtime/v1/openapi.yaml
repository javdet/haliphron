# Haliphron Runtime API v1
#
# The contract between the agent pod and the controller. In the default relay
# artifact mode it is the only network interface the pod uses at all; in
# object-store mode presigned links to a bucket are the other. Either way the
# pod needs neither egress to the control plane nor a backend token (ADR 16).
#
# The controller listens inside the cluster on a separate listener, :8083.
# The address arrives in the pod as HALIPHRON_CALLBACK_URL and is
# cluster-local by construction: the backend cannot know it.
#
# OpenAPI 3.0.3 — for the same reason as the Cluster API: the main
# consumer of the shape is Go code generation.
#
# camelCase naming, as in every machine contract in haliphron.
#
# Semantics live in `docs/contracts/agent-runtime.md`. This file is the shape
# of the messages; that one is the rules, phases, exit codes and file layout.
openapi: 3.0.3

info:
  title: Haliphron Runtime API
  version: 1.0.0
  description: |
    Three endpoints, and they are not equally important.

    `/completion` tells the controller how the run ended. It is an
    **optimization, not a correctness condition**: by the time it is made the
    contents of the result are already durable, including a copy of the report
    itself (`completion.json`). An undelivered webhook does not change the
    pod's exit code — the outcome is visible to the controller through the
    Job's, and the contents are readable under the `runs/{runID}/` prefix.

    `/phase` reports one entrypoint phase as it completes, and is what replaced
    the pod writing a `state.json` checkpoint into a bucket. Losing one costs a
    later attempt redoing a phase it need not have; for the `run` phase, that is
    one extra model bill.

    `/artifacts` carries the run's output, in relay mode. It is the one endpoint
    here that must not answer until its work is durable: the pod treats a 200 as
    permission to exit, so a 200 means the bytes are on a disk that is not the
    pod's. That acknowledgement is the whole of principle P5 in relay mode, and
    it is what makes an object store optional rather than what an object store
    was for.

    `CompletionReport` here is **the same schema** as in the Cluster API: the
    controller forwards the report to `/ingest/completion` unchanged, merely
    wrapping it in an envelope carrying the cluster identity and epoch. The
    match is held by the `TestRuntimeAndClusterAPIAgreeOnCompletionReport`
    test, not by agreement.
  contact:
    name: Haliphron
  license:
    name: Proprietary

servers:
  - url: http://{controllerService}/runtime/v1
    variables:
      controllerService:
        default: haliphron-controller.haliphron-system.svc:8083

tags:
  - name: completion
    description: The pod's completion report
  - name: progress
    description: Phase transitions, as they happen
  - name: artifacts
    description: The run's output, in relay mode

security:
  - callbackToken: []

paths:

  /completion:
    post:
      tags: [completion]
      operationId: reportCompletion
      summary: Report the outcome of a run to the controller
      description: |
        Called exactly once in the normal case, and repeated on a network
        error — delivery is at-least-once, and the receiver is idempotent on
        the (`runID`, `attempt`) pair.

        The order is mandatory: make the result durable first, then this call
        (P5). A report announced before its contents became durable is an
        outcome the backend will see without them. "Durable" is the controller's
        acknowledgement in relay mode and the object store's in the other; it is
        not necessarily a bucket.

        Authentication is the `callback-token` from the per-run Secret. The
        token is minted by the **controller**, not the backend: `callbackURL`
        is cluster-local, and without a token any pod in the agent namespace
        could send a forged completion for somebody else's run. The controller
        checks three things: the token, the `runID` in the body, and the
        `runID` the token is bound to.

        Pod retries: up to 5 attempts with exponential backoff, no longer than
        60 s in total. After that the pod gives up and exits with **its own**
        code, not with a delivery error.
      parameters:
        - $ref: '#/components/parameters/RuntimeContract'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompletionReport'}
      responses:
        '202':
          description: |
            Accepted by the controller. This does not mean the backend knows yet:
            forwarding to `/ingest/completion` is asynchronous and survives the
            backend being unavailable, because the controller holds the report
            and sends it on later.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompletionAck'}
        '400':
          description: The body does not pass the schema. The pod does not retry — a retry would give the same answer.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: The token is missing, does not match, or is bound to a different run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: |
            The `runID` in the body does not match the one the token was issued
            for, or `attempt` is lower than one already accepted. The pod does
            not retry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: The body exceeds the limit. The pod truncates `summary` and retries once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: |
            The controller is restarting. The pod retries with backoff — this is
            the very case the retries here exist for.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /phase:
    post:
      tags: [progress]
      operationId: reportPhase
      summary: Report one entrypoint phase as it completes
      description: |
        The attempt checkpoint, reported as it is made rather than saved as an
        object.

        It replaced `runs/{runID}/state.json`, and the difference is not only
        where the fact lives. The object was written when the pod chose to save
        it — at the end of `persist` and again at `finalize` — so a pod killed
        anywhere between those two points recorded nothing about the phases in
        between. A report at the moment a phase completes is held by something
        that outlives the pod, so an OOM between two phases still leaves the one
        that finished on the record.

        Only an `ok` outcome is recorded by the controller. A failed or skipped
        phase is not something a later attempt may assume was done, and the one
        phase whose replay costs money is exactly where getting that wrong would
        skip a model call that never happened.

        A failure here is logged by the pod and swallowed: losing one report
        costs a later attempt redoing a phase, and failing the run over it costs
        the run.
      parameters:
        - $ref: '#/components/parameters/RuntimeContract'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhaseReport'}
      responses:
        '202':
          description: Recorded, or already known. The pod does not wait on anything beyond this.
        '400':
          description: The body does not pass the schema.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: The token is missing, does not match, or is bound to a different run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: No such run in this cluster.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: The controller could not record it. The pod retries — this record is what keeps the next attempt from paying for the model again.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /artifacts:
    post:
      tags: [artifacts]
      operationId: uploadArtifact
      summary: Upload one artifact to the controller
      description: |
        Relay mode only. In object-store mode the pod PUTs to the store instead
        and never calls this.

        The body is the object and the metadata is in the query and one header:
        base64 in a JSON field would cost a third of the bytes on the one path
        in this system that carries gigabytes.

        **The acknowledgement is the contract.** It does not arrive until the
        bytes are on the controller's volume, and from that moment the pod may
        exit: the controller owns delivery onward, and it survives both the
        pod's deletion and a backend outage. That is principle P5 without a
        bucket.

        `key` is relative to the run — `result.md`, `logs/chunks/000007.log`.
        The controller stamps `runs/{runID}/` onto it from the CR it
        authenticated against; a pod that could name an absolute key could name
        another run's.
      parameters:
        - $ref: '#/components/parameters/RuntimeContract'
        - $ref: '#/components/parameters/Traceparent'
        - name: key
          in: query
          required: true
          description: The object's key, relative to this run's prefix.
          schema: {type: string, minLength: 1, maxLength: 1024, example: 'result.md'}
        - name: attempt
          in: query
          required: false
          description: Which attempt produced it. The controller falls back to the CR's current attempt.
          schema: {type: integer, format: int32, minimum: 1}
        - name: X-Haliphron-SHA256
          in: header
          required: false
          description: |
            The digest of the body, verified before anything is spooled. A
            transfer that was cut is refused rather than stored: a half-written
            `result.md` under the right key is worse than none, because the
            recovery path would read it and believe it.
          schema: {type: string, maxLength: 64, pattern: '^[a-f0-9]{64}$'}
      requestBody:
        required: true
        description: The object itself. At most 256 MiB.
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: |
            On the controller's volume. The pod may now exit as far as this
            object is concerned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactAck'}
        '400':
          description: |
            The body does not match its digest. The pod retries once — the
            likely cause is a connection cut mid-transfer.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: The token is missing, does not match, or is bound to a different run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: |
            This run uploads to object storage, not to the controller. A defect
            rather than a condition; a retry repeats it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: |
            The run has spent its artifact budget, or this object alone exceeds
            256 MiB. The one refusal the pod can act on: it drops the object,
            notes it in the log and carries on rather than failing a run over an
            attachment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: The controller is restarting. The pod retries with backoff.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

components:

  securitySchemes:
    callbackToken:
      type: http
      scheme: bearer
      description: |
        The `callback-token` from the per-run Secret mounted at
        `/haliphron/secrets/`. It lives exactly as long as the AgentRun and is
        garbage-collected along with it.

  parameters:
    RuntimeContract:
      name: X-Haliphron-Contract
      in: header
      required: true
      schema: {type: string, example: '1.0'}
      description: |
        The version of the runtime contract the image implements. The major
        must match what the controller expects; a mismatch here means the
        check at pod startup (`HALIPHRON_CONTRACT`) was bypassed.
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema: {type: string}
      description: W3C trace context, the continuation of the attempt's span
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, example: '01J8X4K2ZQ7YB3M9F0R5W6T8CD/1'}
      description: |
        `{runID}/{attempt}`. It duplicates what is already in the body, and it
        is worth it: the controller drops a repeat without parsing the payload.

  schemas:

    ULID:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      maxLength: 26

    MoneyUSD:
      type: string
      pattern: '^-?[0-9]{1,12}(\.[0-9]{1,6})?$'
      maxLength: 32
      description: Money as a string, not a float

    AgentType:
      type: string
      enum: [claude-code, codex]
      maxLength: 32

    FailureClass:
      type: string
      enum: [none, infra, agent, git, config, budget]
      description: |
        The failure class is determined by the **pod**, not the controller: only
        the pod has the cause rather than the effect. The controller may
        reclassify only what it observes itself — OOMKill, eviction,
        cancellation.

    RuntimePhase:
      type: string
      enum: [init, validate, fetch, checkpoint, auth, clone, role, plugins,
             mcp-prepare, mcp-verify, run, parse, output, persist, commit, push,
             pr, finalize, notify]
      description: An entrypoint phase. The names are contract, not logging.

    PhaseOutcome:
      type: string
      enum: [ok, skipped, failed]

    ObjectRef:
      type: object
      description: |
        A reference to a stored object. There is deliberately no bucket: which
        store holds it is the installation's business, and a pod that never
        learns a bucket name cannot leak one.
      required: [key]
      properties:
        key: {type: string, minLength: 1, maxLength: 1024}
        sizeBytes: {type: integer, format: int64, minimum: 0}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$', maxLength: 64}
        contentType: {type: string, maxLength: 128}
        uploaded:
          type: boolean
          description: |
            Whether the bytes are durable. In relay mode it is the controller's
            acknowledgement; in object-store mode it is this pod's own PUT.

    PhaseReport:
      type: object
      description: One entrypoint phase, reported as it completes.
      required: [runID, attempt, phase, outcome]
      properties:
        runID: {$ref: '#/components/schemas/ULID'}
        attempt: {type: integer, format: int32, minimum: 1}
        phase: {$ref: '#/components/schemas/RuntimePhase'}
        outcome: {$ref: '#/components/schemas/PhaseOutcome'}
        durationMs: {type: integer, format: int64, minimum: 0}
        reason: {type: string, maxLength: 128}

    ArtifactAck:
      type: object
      description: |
        What the controller answers an upload with. The pod waits for it, and
        what it means is the whole of principle P5 in relay mode: the bytes are
        on a disk that is not the pod's.
      required: [ref]
      properties:
        ref:
          allOf:
            - $ref: '#/components/schemas/ObjectRef'
          description: |
            The object as the controller stored it, with the run prefix the
            controller stamped and `uploaded` set. The pod puts this in its
            report verbatim rather than constructing one of its own.
        bytesRemaining:
          type: integer
          format: int64
          description: |
            What is left of the run's artifact budget. Reported so that an
            entrypoint about to upload a two-gigabyte log can drop it and say
            so, instead of discovering the cap as a refusal after the transfer.

    CompletionReport:
      type: object
      description: |
        The report assembled by the pod. It leaves in two copies: as a webhook
        to the controller on `/completion`, and as the
        `runs/{runID}/completion.json` object. The copies are byte-for-byte
        identical — either one may turn out to be the one that survived.

        The data is self-declared by the least trusted component in the system.
        Cost and tokens are taken from the agent CLI's output and are not
        unforgeable.
      required: [runID, attempt, status, exitCode, agent]
      properties:
        runID: {$ref: '#/components/schemas/ULID'}
        attempt: {type: integer, format: int32, minimum: 1}
        status:
          type: string
          enum: [success, failure, timeout, cancelled]
          description: |
            Derivable from the exit code and sent all the same: cancellation is
            indistinguishable from eviction by code, since both arrive as
            signal 143.
        exitCode: {type: integer, format: int32}
        failureClass: {$ref: '#/components/schemas/FailureClass'}
        failedPhase: {$ref: '#/components/schemas/RuntimePhase'}
        reason:
          type: string
          maxLength: 128
          description: |
            A short CamelCase reason in the Kubernetes idiom —
            `MCPServersUnavailable`, `PromptDigestMismatch`,
            `PushRejected`. It ends up in the CR's `status.reason` and in the UI.
          example: MCPServersUnavailable
        message:
          type: string
          maxLength: 1024
          description: |
            A human-readable explanation. Without these three fields a "Failed,
            config" outcome in the UI is indistinguishable from any other, and
            the evidence exists exactly once — in the pod, at the moment of
            failure.
        agent: {$ref: '#/components/schemas/AgentType'}
        model: {type: string, maxLength: 253}
        runtime: {$ref: '#/components/schemas/RuntimeInfo'}
        resultRef: {$ref: '#/components/schemas/ObjectRef'}
        outputRef: {$ref: '#/components/schemas/ObjectRef'}
        logRef: {$ref: '#/components/schemas/ObjectRef'}
        completedPhases:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/RuntimePhase'}
          description: |
            What this attempt and every earlier one got through, in execution
            order. A summary: `/phase` is the primary channel, and this is the
            copy that survives a pod whose last few reports did not get through.

            There is no `stateRef` beside it. The checkpoint is a column in the
            control plane's `run_attempts` now, not an object this pod writes.
        summary:
          type: string
          maxLength: 65536
          description: The first 64 KiB of `result.md` — the only content in this contract
        repo: {$ref: '#/components/schemas/RepoResult'}
        usage: {$ref: '#/components/schemas/Usage'}
        phaseTimings:
          type: array
          maxItems: 64
          description: |
            Phase durations. A cheap substitute for tracing when OTLP is not
            configured, and the only way to see that the time went into cloning
            a monorepo rather than into the LLM.
          items: {$ref: '#/components/schemas/PhaseTiming'}
        childRunIDs:
          type: array
          maxItems: 64
          description: Runs spawned by this one through the per-run MCP token
          items: {$ref: '#/components/schemas/ULID'}

    RuntimeInfo:
      type: object
      description: |
        What exactly did the work. Without this, a behavior change across a
        fleet of clusters running different image tags is diagnosed by guesswork.
      properties:
        image: {type: string, maxLength: 512}
        imageVersion: {type: string, maxLength: 128}
        contractVersion: {type: string, maxLength: 16}
        agentVersion: {type: string, maxLength: 64}

    RepoResult:
      type: object
      description: Absent for a run without a repository — which is a legal case
      properties:
        pushed: {type: boolean}
        targetBranch: {type: string, maxLength: 255}
        commitSHA: {type: string, maxLength: 64}
        prURL: {type: string, maxLength: 512}
        prNumber: {type: integer, format: int32}
        prAction:
          type: string
          enum: [created, updated, none]
          description: create-or-update — one of the converging side effects that make a retry safe

    PhaseTiming:
      type: object
      required: [phase, durationMs]
      properties:
        phase: {$ref: '#/components/schemas/RuntimePhase'}
        durationMs: {type: integer, format: int64}
        outcome: {$ref: '#/components/schemas/PhaseOutcome'}

    Usage:
      type: object
      properties:
        durationMs: {type: integer, format: int64}
        numTurns: {type: integer, format: int32}
        totalCostUSD: {$ref: '#/components/schemas/MoneyUSD'}
        inputTokens: {type: integer, format: int64}
        outputTokens: {type: integer, format: int64}
        cacheReadTokens: {type: integer, format: int64}
        cacheWriteTokens: {type: integer, format: int64}
        sessionID: {type: string, maxLength: 256}

    CompletionAck:
      type: object
      required: [accepted]
      properties:
        accepted: {type: boolean}
        duplicate:
          type: boolean
          description: A report for this (runID, attempt) pair has already been accepted; the repeat was ignored

    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: TokenMismatch}
        message: {type: string}
