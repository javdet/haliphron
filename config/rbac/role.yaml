---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: haliphron-controller
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - haliphron.io
  resources:
  - agentruns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - haliphron.io
  resources:
  - agentruns/finalizers
  verbs:
  - update
- apiGroups:
  - haliphron.io
  resources:
  - agentruns/status
  verbs:
  - get
  - patch
  - update
